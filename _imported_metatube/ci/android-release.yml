name: MetaTube Android CI & Release

on:
  push:
    branches:
      - main
      - master
    tags:
      - "v*"
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build_and_release:
    name: Build, Test & Release MetaTube APK/AAB
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"

      - name: Prepare debug keystore and environment secrets
        shell: bash
        run: |
          if [ ! -f debug.keystore ] && [ -f debug.keystore.base64 ]; then
            base64 -d debug.keystore.base64 > debug.keystore
          fi
          cp -n .env.example .env || true
          if [ -n "${{ secrets.YOUTUBE_INNERTUBE_KEY }}" ]; then
            echo "YOUTUBE_INNERTUBE_KEY=${{ secrets.YOUTUBE_INNERTUBE_KEY }}" >> .env
          fi

      - name: Configure Release Signing Keystore
        shell: bash
        run: |
          if [ -n "${{ secrets.KEYSTORE_BASE64 }}" ]; then
            echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > "${{ github.workspace }}/release-upload-key.jks"
            echo "KEYSTORE_PATH=${{ github.workspace }}/release-upload-key.jks" >> "$GITHUB_ENV"
            echo "STORE_PASSWORD=${{ secrets.STORE_PASSWORD }}" >> "$GITHUB_ENV"
            echo "KEY_PASSWORD=${{ secrets.KEY_PASSWORD }}" >> "$GITHUB_ENV"
          else
            echo "::notice::KEYSTORE_BASE64 secret not set; generating ephemeral CI upload keystore for automated release artifact."
            CI_PASS="metatube-ci-$(date +%s)"
            keytool -genkeypair -v \
              -keystore "${{ github.workspace }}/release-upload-key.jks" \
              -storepass "$CI_PASS" \
              -keypass "$CI_PASS" \
              -alias upload \
              -keyalg RSA -keysize 2048 -validity 3650 \
              -dname "CN=MetaTube CI, OU=Mobile, O=MetaTube, L=Dhaka, C=BD"
            echo "KEYSTORE_PATH=${{ github.workspace }}/release-upload-key.jks" >> "$GITHUB_ENV"
            echo "STORE_PASSWORD=$CI_PASS" >> "$GITHUB_ENV"
            echo "KEY_PASSWORD=$CI_PASS" >> "$GITHUB_ENV"
          fi

      - name: Run Unit & Robolectric Tests
        run: gradle :app:testDebugUnitTest --no-daemon

      - name: Run Android Lint
        run: gradle :app:lintDebug --no-daemon

      - name: Build Debug & Release APKs and App Bundle
        run: gradle :app:assembleDebug :app:assembleRelease :app:bundleRelease --no-daemon

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MetaTube-Debug-APK
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload Release APK & AAB Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: MetaTube-Release-Artifacts
          path: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/bundle/release/*.aab
          if-no-files-found: error

      - name: Publish GitHub Release on Tag or Main Push
        if: github.event_name == 'push' && (startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || format('v2.4.0-{0}', github.run_number) }}
          name: ${{ startsWith(github.ref, 'refs/tags/v') && format('MetaTube {0}', github.ref_name) || format('MetaTube v2.4.0 (Build {0})', github.run_number) }}
          generate_release_notes: true
          files: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/bundle/release/*.aab

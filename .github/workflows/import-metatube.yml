name: Import MetaTube Source Archive

on:
  push:
    branches:
      - 'arena/c5bfd128-snaptube'
    paths:
      - '.github/workflows/import-metatube.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import-zip:
    runs-on: ubuntu-latest
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: arena/c5bfd128-snaptube
          fetch-depth: 0

      - name: Download and inspect metatube.zip
        run: |
          if [ -d "_imported_metatube" ]; then
            echo "Already imported"
            exit 0
          fi
          curl -fSL -o /tmp/metatube.zip "https://github.com/mdmukul120/meta-tube-/releases/download/meta/metatube.zip"
          mkdir -p _imported_metatube
          unzip -q -o /tmp/metatube.zip -d _imported_metatube
          find _imported_metatube -name ".git" -exec rm -rf {} + || true
          find _imported_metatube \( -name "node_modules" -o -name ".gradle" -o -name "__pycache__" -o -name ".DS_Store" \) -exec rm -rf {} + || true
          find _imported_metatube -maxdepth 4 | sort > /tmp/tree.txt
          head -n 60 /tmp/tree.txt

      - name: Commit imported source to branch
        run: |
          set +e
          git config user.name "mdmukul120"
          git config user.email "143794390+mdmukul120@users.noreply.github.com"
          git checkout -B arena/c5bfd128-snaptube
          git add -A _imported_metatube > /tmp/git.log 2>&1
          RC1=$?
          git status --short | head -n 50 >> /tmp/git.log 2>&1
          git commit -m "chore: import metatube.zip source for audit and APK build [skip ci]" >> /tmp/git.log 2>&1
          RC2=$?
          git push origin HEAD:refs/heads/arena/c5bfd128-snaptube >> /tmp/git.log 2>&1
          RC3=$?
          if [ $RC1 -ne 0 ] || [ $RC2 -ne 0 ] || [ $RC3 -ne 0 ]; then
            MSG=$(tail -c 3500 /tmp/git.log | tr '\n' ' ')
            echo "::error title=GitImportFailed::RC=$RC1,$RC2,$RC3 :: $MSG"
            cat /tmp/git.log
            exit 1
          fi
